<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Завдання 4 — Профіль</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green-dark:  #1a3a2a;
            --green-mid:   #2d6a4f;
            --green-light: #52b788;
            --green-pale:  #d8f3dc;
            --accent:      #40916c;
            --gold:        #d4a832;
            --card-bg:     rgba(255,255,255,0.88);
            --card-border: rgba(82,183,136,0.4);
            --text:        #1a3a2a;
            --muted:       #4a7c5e;
            --error:       #b03030;
        }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            color: var(--text);
        }

        .hero-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .hero-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .hero-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                    160deg,
                    rgba(10,30,20,0.72) 0%,
                    rgba(26,58,42,0.55) 40%,
                    rgba(45,106,79,0.4) 100%
            );
        }

        .gallery-strip {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            z-index: 1;
            display: flex;
            gap: 4px;
            overflow: hidden;
        }

        .gallery-strip img {
            flex: 1;
            min-width: 0;
            height: 100%;
            object-fit: cover;
            opacity: 0.55;
            filter: saturate(1.2);
            transition: opacity 0.3s;
        }

        .gallery-strip img:hover { opacity: 0.85; }

        .page-wrap {
            position: relative;
            z-index: 2;
            max-width: 820px;
            margin: 0 auto;
            padding: 3rem 1.5rem 9rem;
        }

        .page-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(64,145,108,0.75);
            backdrop-filter: blur(8px);
            color: #d8f3dc;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 5px 16px;
            border-radius: 50px;
            border: 1px solid rgba(82,183,136,0.5);
            margin-bottom: 2rem;
        }

        .page-label::before { content: '🌿'; font-size: 0.9rem; }

        #status {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #d8f3dc;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 1.5rem 0;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(216,243,220,0.3);
            border-top-color: var(--green-light);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #error-box {
            display: none;
            background: rgba(255,240,240,0.92);
            backdrop-filter: blur(8px);
            border: 2px solid #ffb3b3;
            border-left: 5px solid var(--error);
            color: var(--error);
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            font-size: 0.92rem;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        #error-box strong { display: block; margin-bottom: 0.3rem; }

        .profile-card {
            display: none;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 0;
            margin-bottom: 2rem;
            overflow: hidden;
            box-shadow: 0 12px 48px rgba(0,0,0,0.35);
        }

        .profile-banner {
            height: 140px;
            position: relative;
            overflow: hidden;
        }

        .profile-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 40%;
        }

        .profile-banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 40%, rgba(255,255,255,0.88) 100%);
        }

        .profile-body {
            padding: 0 2rem 2rem;
        }

        .profile-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green-mid), var(--green-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: #fff;
            margin-top: -36px;
            margin-bottom: 1rem;
            border: 4px solid #fff;
            box-shadow: 0 4px 16px rgba(45,106,79,0.35);
            position: relative;
            z-index: 1;
        }

        .profile-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.8rem;
        }

        .profile-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.5rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.88rem;
            color: var(--muted);
            font-weight: 600;
        }

        .meta-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--green-pale);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .section-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.2rem;
        }

        .section-head h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            color: #d8f3dc;
            text-shadow: 0 1px 6px rgba(0,0,0,0.4);
        }

        .section-head .count-pill {
            background: rgba(82,183,136,0.7);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 50px;
        }

        #posts-grid {
            display: grid;
            gap: 1rem;
        }

        .post-card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 1.3rem 1.5rem;
            opacity: 0;
            transform: translateY(16px);
            animation: up 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
            transition: transform 0.25s, box-shadow 0.25s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.18);
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 36px rgba(0,0,0,0.28);
        }

        .post-card::before {
            content: '🌿';
            float: right;
            font-size: 1rem;
            opacity: 0.6;
            margin-left: 8px;
        }

        .post-card:nth-child(even)::before   { content: '🍃'; }
        .post-card:nth-child(3n)::before     { content: '🌱'; }
        .post-card:nth-child(4n)::before     { content: '🌾'; }

        @keyframes up { to { opacity: 1; transform: translateY(0); } }

        .post-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--green-dark);
            margin-bottom: 0.5rem;
            text-transform: capitalize;
            line-height: 1.35;
        }

        .post-divider {
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, var(--green-light), transparent);
            border-radius: 2px;
            margin-bottom: 0.55rem;
        }

        .post-body {
            font-size: 0.86rem;
            color: var(--muted);
            line-height: 1.7;
        }
    </style>
</head>
<body>

<div class="hero-bg">
    <img
            id="img-hero"
            src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=1600&auto=format&fit=crop"
            alt="forest background"
    />
</div>

<div class="gallery-strip" aria-hidden="true">
    <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400&auto=format&fit=crop" alt=""/>
    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&auto=format&fit=crop" alt=""/>
    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=400&auto=format&fit=crop" alt=""/>
    <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=400&auto=format&fit=crop" alt=""/>
    <img src="https://images.unsplash.com/photo-1523712999610-f77fbcfc3843?w=400&auto=format&fit=crop" alt=""/>
    <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=400&auto=format&fit=crop" alt=""/>
    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=400&auto=format&fit=crop" alt=""/>
</div>

<div class="page-wrap">
    <div class="page-label">Завдання 4 — Профіль користувача</div>

    <div id="error-box">
        <strong>⚠ Помилка</strong>
        <span id="error-msg"></span>
    </div>

    <div id="status">
        <div class="spinner"></div>
        Завантаження профілю та постів…
    </div>

    <div class="profile-card" id="profile-card">
        <div class="profile-banner">
            <img
                    id="img-banner"
                    src="https://images.unsplash.com/photo-1476673160081-cf065607f449?w=900&auto=format&fit=crop"
                    alt="garden banner"
            />
        </div>
        <div class="profile-body">
            <div class="profile-avatar" id="profile-avatar"></div>
            <div class="profile-name" id="profile-name"></div>
            <div class="profile-meta">
                <div class="meta-item">
                    <div class="meta-icon">✉️</div>
                    <span id="profile-email"></span>
                </div>
                <div class="meta-item">
                    <div class="meta-icon">📍</div>
                    <strong id="profile-city"></strong>
                </div>
            </div>
        </div>
    </div>

    <div id="posts-section" style="display:none">
        <div class="section-head">
            <h2 id="posts-label"></h2>
        </div>
        <div id="posts-grid"></div>
        <template id="post-tpl"><div class="post-card"></div></template>
    </div>
</div>

<script>
    const imgHero = document.getElementById('img-hero');
    const imgBanner = document.getElementById('img-banner');

    imgHero.addEventListener('error', function onHeroError() {
        imgHero.src = 'https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?w=1600&auto=format&fit=crop';
        imgHero.removeEventListener('error', onHeroError);
    });

    imgBanner.addEventListener('error', function onBannerError() {
        imgBanner.src = 'https://images.unsplash.com/photo-1490750967868-88df5691cc6a?w=900&auto=format&fit=crop';
        imgBanner.removeEventListener('error', onBannerError);
    });

    const statusEl = document.getElementById('status');
    const errorBox = document.getElementById('error-box');
    const errorMsg = document.getElementById('error-msg');
    const profileCard = document.getElementById('profile-card');
    const postsSection = document.getElementById('posts-section');
    const postsGrid = document.getElementById('posts-grid');

    function showError(message) {
        statusEl.style.display = 'none';
        errorMsg.textContent = message;
        errorBox.style.display = 'block';
    }

    async function loadProfile() {
        try {
            const [userRes, postsRes] = await Promise.all([
                fetch('https://jsonplaceholder.typicode.com/users/1'),
                fetch('https://jsonplaceholder.typicode.com/posts?userId=1')
            ]);

            if (!userRes.ok) {
                showError(`Користувач: HTTP ${userRes.status}`);
                return;
            }
            if (!postsRes.ok) {
                showError(`Пости: HTTP ${postsRes.status}`);
                return;
            }

            const [user, posts] = await Promise.all([
                userRes.json(),
                postsRes.json()
            ]);

            statusEl.style.display = 'none';

            document.getElementById('profile-avatar').textContent = user.name[0].toUpperCase();
            document.getElementById('profile-name').textContent = user.name;
            document.getElementById('profile-email').textContent = user.email;
            document.getElementById('profile-city').textContent = user.address.city;
            profileCard.style.display = 'block';

            document.getElementById('posts-label').textContent = `🌿 Пости · ${posts.length}`;
            postsSection.style.display = 'block';

            posts.forEach((post, i) => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.style.animationDelay = `${i * 40}ms`;
                card.innerHTML = `
          <div class="post-title">${post.title}</div>
          <div class="post-divider"></div>
          <div class="post-body">${post.body}</div>
        `;
                postsGrid.appendChild(card);
            });

        } catch (err) {
            showError(err.message);
        }
    }

    loadProfile();
</script>

</body>
</html>
