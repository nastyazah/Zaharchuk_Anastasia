<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Завдання 3 — Пости</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent:  #e8427a;
            --accent2: #f472a8;
            --soft:    #ffd6e7;
            --text:    #4a1a2c;
            --muted:   #b07090;
            --card:    rgba(255,255,255,0.82);
            --border:  rgba(249,184,208,0.7);
        }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }

        .video-wrap {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .video-wrap video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .video-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                    160deg,
                    rgba(255,182,208,0.55) 0%,
                    rgba(255,105,158,0.35) 50%,
                    rgba(255,182,208,0.55) 100%
            );
        }

        /* ── FLOATING PHOTOS ── */
        .float-photos {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .fphoto {
            position: absolute;
            border-radius: 18px;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.7);
            box-shadow: 0 8px 32px rgba(200,60,120,0.25);
            opacity: 0;
            animation: floatPhoto ease-in-out infinite alternate;
        }

        .fphoto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: saturate(1.15) brightness(1.05);
        }

        .fphoto:nth-child(1) { width:140px; height:180px; left:2%;   top:10%; animation-duration:9s;  animation-delay:0s;   }
        .fphoto:nth-child(2) { width:110px; height:140px; left:5%;   top:60%; animation-duration:11s; animation-delay:1.5s; }
        .fphoto:nth-child(3) { width:160px; height:120px; right:3%;  top:8%;  animation-duration:13s; animation-delay:0.8s; }
        .fphoto:nth-child(4) { width:120px; height:150px; right:2%;  top:55%; animation-duration:10s; animation-delay:2.5s; }
        .fphoto:nth-child(5) { width:100px; height:130px; left:3%;   top:35%; animation-duration:14s; animation-delay:3s;   }
        .fphoto:nth-child(6) { width:130px; height:100px; right:4%;  top:35%; animation-duration:8s;  animation-delay:1s;   }
        .fphoto:nth-child(7) { width:90px;  height:120px; left:7%;   top:80%; animation-duration:12s; animation-delay:4s;   }
        .fphoto:nth-child(8) { width:115px; height:145px; right:6%;  top:78%; animation-duration:15s; animation-delay:2s;   }

        @keyframes floatPhoto {
            0%   { opacity: 0.55; transform: translateY(0)    rotate(-3deg) scale(1);    }
            50%  { opacity: 0.75;                                                          }
            100% { opacity: 0.55; transform: translateY(-22px) rotate(3deg) scale(1.04); }
        }

        .petals {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -40px;
            font-size: 1.4rem;
            animation: petalFall linear infinite;
            opacity: 0.7;
        }

        .petal:nth-child(1)  { left:5%;   animation-duration:7s;  animation-delay:0s;   }
        .petal:nth-child(2)  { left:15%;  animation-duration:9s;  animation-delay:1.2s; font-size:1rem; }
        .petal:nth-child(3)  { left:25%;  animation-duration:8s;  animation-delay:2.4s; }
        .petal:nth-child(4)  { left:38%;  animation-duration:11s; animation-delay:0.6s; font-size:1.8rem; }
        .petal:nth-child(5)  { left:52%;  animation-duration:6s;  animation-delay:3.5s; font-size:0.9rem; }
        .petal:nth-child(6)  { left:63%;  animation-duration:10s; animation-delay:1.8s; }
        .petal:nth-child(7)  { left:74%;  animation-duration:8s;  animation-delay:4s;   font-size:1.6rem; }
        .petal:nth-child(8)  { left:85%;  animation-duration:7s;  animation-delay:2s;   }
        .petal:nth-child(9)  { left:92%;  animation-duration:9s;  animation-delay:0.4s; font-size:1.1rem; }
        .petal:nth-child(10) { left:46%;  animation-duration:12s; animation-delay:5s;   font-size:0.85rem; }
        .petal:nth-child(11) { left:30%;  animation-duration:7s;  animation-delay:6s;   }
        .petal:nth-child(12) { left:70%;  animation-duration:10s; animation-delay:3s;   font-size:1.3rem; }

        @keyframes petalFall {
            0%   { transform: translateY(-40px) translateX(0)   rotate(0deg);   opacity: 0; }
            10%  { opacity: 0.7; }
            90%  { opacity: 0.5; }
            100% { transform: translateY(110vh) translateX(60px) rotate(540deg); opacity: 0; }
        }

        .page {
            position: relative;
            z-index: 3;
        }

        header {
            text-align: center;
            padding: 4rem 2rem 3rem;
            position: relative;
        }

        .badge {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 5px 18px;
            border-radius: 50px;
            margin-bottom: 1.2rem;
            box-shadow: 0 4px 18px rgba(232,66,122,0.5);
            backdrop-filter: blur(6px);
        }

        header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3rem, 8vw, 5.5rem);
            color: #fff;
            text-shadow:
                    0 2px 20px rgba(232,66,122,0.6),
                    0 0 60px rgba(255,150,200,0.4);
            line-height: 1.05;
            animation: titlePulse 4s ease-in-out infinite alternate;
        }

        @keyframes titlePulse {
            from { text-shadow: 0 2px 20px rgba(232,66,122,0.5), 0 0 60px rgba(255,150,200,0.3); }
            to   { text-shadow: 0 2px 30px rgba(232,66,122,0.9), 0 0 80px rgba(255,150,200,0.7); }
        }

        header p {
            color: rgba(255,255,255,0.85);
            font-size: 0.9rem;
            margin-top: 0.6rem;
            font-weight: 600;
            text-shadow: 0 1px 6px rgba(0,0,0,0.25);
        }

        main {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 1.5rem 5rem;
        }

        #status {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            padding: 2rem;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            text-shadow: 0 1px 6px rgba(0,0,0,0.3);
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #error-box {
            display: none;
            background: rgba(255,240,244,0.92);
            backdrop-filter: blur(10px);
            border: 2px solid #ffb3c6;
            border-left: 5px solid #cc2255;
            color: #cc2255;
            border-radius: 18px;
            padding: 1.2rem 1.5rem;
            font-size: 0.92rem;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        #error-box strong { display: block; margin-bottom: 0.3rem; }

        #posts-count {
            display: none;
            font-size: 0.9rem;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            padding: 0.85rem 1.6rem;
            background: rgba(232,66,122,0.55);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 50px;
            text-align: center;
            font-weight: 700;
            text-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        #posts-count span { color: #fff; font-size: 1.05rem; }

        #posts-list { display: grid; gap: 1.1rem; }

        .post-card {
            background: var(--card);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 1.5rem 1.7rem 1.5rem 1.9rem;
            position: relative;
            opacity: 0;
            transform: translateY(24px) scale(0.97);
            animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
            box-shadow: 0 6px 24px rgba(200,60,120,0.14);
        }

        .post-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 18px 48px rgba(200,60,120,0.28);
            background: rgba(255,255,255,0.93);
        }

        .post-card::before {
            content: '🌸';
            position: absolute;
            top: 1.1rem;
            left: -0.6rem;
            font-size: 1.3rem;
            filter: drop-shadow(1px 2px 3px rgba(200,60,120,0.3));
            transition: transform 0.3s;
        }

        .post-card:hover::before { transform: scale(1.3) rotate(15deg); }

        .post-card:nth-child(even)::before { content: '🌺'; }
        .post-card:nth-child(3n)::before   { content: '🌼'; }
        .post-card:nth-child(5n)::before   { content: '🌷'; }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .post-num {
            position: absolute;
            top: 1.1rem;
            right: 1.3rem;
            font-size: 0.68rem;
            color: var(--muted);
            background: rgba(255,214,231,0.8);
            padding: 2px 10px;
            border-radius: 50px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .post-title {
            font-family: 'Dancing Script', cursive;
            font-size: 1.4rem;
            color: var(--accent);
            margin-bottom: 0.4rem;
            line-height: 1.25;
            padding-right: 3.5rem;
            text-transform: capitalize;
        }

        .divider {
            width: 44px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent2), transparent);
            border-radius: 2px;
            margin-bottom: 0.55rem;
            transition: width 0.3s;
        }

        .post-card:hover .divider { width: 80px; }

        .post-body {
            font-size: 0.87rem;
            color: var(--muted);
            line-height: 1.7;
        }
    </style>
</head>
<body>

<div class="video-wrap">
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="https://videos.pexels.com/video-files/3836395/3836395-hd_1920_1080_30fps.mp4" type="video/mp4"/>
        <source src="https://videos.pexels.com/video-files/4622943/4622943-hd_1920_1080_25fps.mp4" type="video/mp4"/>
    </video>
</div>

<div class="float-photos" aria-hidden="true">
    <div class="fphoto"><img src="https://images.unsplash.com/photo-1490750967868-88df5691cc6a?w=300&auto=format&fit=crop" alt=""/></div>
    <div class="fphoto"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=300&auto=format&fit=crop" alt=""/></div>
    <div class="fphoto"><img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?w=300&auto=format&fit=crop" alt=""/></div>
    <div class="fphoto"><img src="https://images.unsplash.com/photo-1510627489930-0c1b0bfb6785?w=300&auto=format&fit=crop" alt=""/></div>
    <div class="fphoto"><img src="https://images.unsplash.com/photo-1444930694458-01babf71870c?w=300&auto=format&fit=crop" alt=""/></div>
    <div class="fphoto"><img src="https://images.unsplash.com/photo-1455659817273-f96807779a8a?w=300&auto=format&fit=crop" alt=""/></div>
    <div class="fphoto"><img src="https://images.unsplash.com/photo-1487530811015-780780f9a274?w=300&auto=format&fit=crop" alt=""/></div>
    <div class="fphoto"><img src="https://images.unsplash.com/photo-1508349937151-22b68b72d5b5?w=300&auto=format&fit=crop" alt=""/></div>
</div>

<div class="petals" aria-hidden="true">
    <span class="petal">🌸</span>
    <span class="petal">🌺</span>
    <span class="petal">🌸</span>
    <span class="petal">🌷</span>
    <span class="petal">🌸</span>
    <span class="petal">🌺</span>
    <span class="petal">🌸</span>
    <span class="petal">🌼</span>
    <span class="petal">🌸</span>
    <span class="petal">🌺</span>
    <span class="petal">🌸</span>
    <span class="petal">🌷</span>
</div>

<div class="page">
    <header>
        <div class="badge">Завдання 3</div>
        <h1>🌷 Стрічка постів 🌷</h1>
        <p>PickMe page</p>
    </header>

    <main>
        <div id="error-box">
            <strong>⚠ Помилка завантаження</strong>
            <span id="error-msg"></span>
        </div>

        <div id="status">
            <div class="spinner"></div>
            Завантаження постів…
        </div>

        <div id="posts-count"></div>
        <div id="posts-list"></div>
        <template id="post-tpl"><div class="post-card"></div></template>
    </main>
</div>

<script>
    const statusEl = document.getElementById('status');
    const errorBox = document.getElementById('error-box');
    const errorMsg = document.getElementById('error-msg');
    const postsCount = document.getElementById('posts-count');
    const postsList = document.getElementById('posts-list');

    const bgVideo = document.getElementById('bg-video');
    bgVideo.addEventListener('error', function onVideoError() {
        bgVideo.style.display = 'none';
        bgVideo.removeEventListener('error', onVideoError);
    });

    function showError(message) {
        statusEl.style.display = 'none';
        errorMsg.textContent = message;
        errorBox.style.display = 'block';
    }

    async function fetchPosts() {
        try {
            const response = await fetch('https://jsonplaceholder.typicode.com/posts');

            if (!response.ok) {
                showError(`HTTP ${response.status}: ${response.statusText}`);
                return;
            }

            const posts = await response.json();

            statusEl.style.display = 'none';

            postsCount.innerHTML = `🌸 Знайдено <span>${posts.length}</span> постів 🌸`;
            postsCount.style.display = 'block';

            posts.forEach((post, i) => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.style.animationDelay = `${i * 35}ms`;
                card.innerHTML = `
          <span class="post-num">#${post.id}</span>
          <div class="post-title">${post.title}</div>
          <div class="divider"></div>
          <div class="post-body">${post.body}</div>
        `;
                postsList.appendChild(card);
            });

        } catch (error) {
            showError(error.message);
        }
    }

    fetchPosts();
</script>

</body>
</html>
